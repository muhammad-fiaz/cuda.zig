name: Feature Request
description: Propose a new feature or API for cuda.zig
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please search [existing issues](https://github.com/muhammad-fiaz/cuda.zig/issues) and [discussions](https://github.com/muhammad-fiaz/cuda.zig/discussions) to avoid duplicates.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? What is the use case?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or Solution
      description: Describe the desired API shape or behavior. Zig code sketches welcome.
      render: zig
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you have tried or considered.
    validations:
      required: false
