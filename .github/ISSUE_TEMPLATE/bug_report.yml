name: Bug Report
description: Report a bug or unexpected behavior in cuda.zig
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in the details below as thoroughly as possible.
        Incomplete reports slow down resolution. For general questions, use [Discussions](https://github.com/muhammad-fiaz/cuda.zig/discussions).

  - type: input
    id: zig_version
    attributes:
      label: Zig Version
      placeholder: "e.g. 0.16.0"
    validations:
      required: true

  - type: input
    id: cuda_version
    attributes:
      label: CUDA Toolkit Version
      description: Run `nvcc --version` or check your driver. Leave blank if running in CPU fallback mode.
      placeholder: "e.g. CUDA 13.3, or N/A (CPU fallback)"
    validations:
      required: false

  - type: input
    id: gpu_model
    attributes:
      label: GPU Model
      placeholder: "e.g. NVIDIA RTX 4090, or N/A"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Windows 11, Ubuntu 22.04, macOS 14"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Minimal Zig code that reproduces the issue.
      render: zig
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Error Output
      render: shell
    validations:
      required: true
